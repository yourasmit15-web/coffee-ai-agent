name: Deploy Coffee AI Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: coffee-ai-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROJECT_ID:-}" || { echo "Missing GitHub Actions variable: GCP_PROJECT_ID"; exit 1; }
          test -n "${REGION:-}" || { echo "Missing GitHub Actions variable: GCP_REGION"; exit 1; }
          test -n "${{ vars.WIF_PROVIDER }}" || { echo "Missing GitHub Actions variable: WIF_PROVIDER"; exit 1; }
          test -n "${{ vars.WIF_SERVICE_ACCOUNT }}" || { echo "Missing GitHub Actions variable: WIF_SERVICE_ACCOUNT"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy backend to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --source ./backend \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=$REGION,COFFEE_AGENT_MODEL=gemini-2.5-flash,COFFEE_AGENT_EMBEDDING_MODEL=gemini-embedding-001"

      - name: Verify Cloud Run revision and HTTP endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"

          test -n "$URL" || { echo "Cloud Run did not return a service URL."; exit 1; }
          echo "Cloud Run URL: $URL"

          echo "Checking service endpoint..."
          curl --fail --silent --show-error --location --max-time 30 "$URL" >/tmp/cloud-run-root.txt

          echo "Checking ADK application endpoint..."
          curl --fail --silent --show-error --location --max-time 30 "$URL/list-apps" >/tmp/cloud-run-apps.json
          cat /tmp/cloud-run-apps.json

          echo "Deployment verification passed."
